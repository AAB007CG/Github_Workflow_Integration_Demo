name: SonarCloud Code Review

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # PR title validation
      - name: Validate PR title format
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context?.payload?.pull_request;
            const title = pr?.title?.trim() || '';

            if (!pr) {
              core.setFailed('No pull request payload found.');
              return;
            }

            if (!title) {
              core.setFailed('PR title is empty.');
              return;
            }

            const pattern = /^[A-Z]{2,10}-\d+:\s?.*$/;
            const matches = pattern.test(title);

            if (!matches) {
              core.setFailed(
                `Invalid PR title: "${title}"
                Expected pattern: [A-Z]{2,10}-[0-9]+: <description>`
              );
            }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java Version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=aab007cg-1
            -Dsonar.projectKey=AAB007CG_Github_Workflow_Integration_Demo
            -Dsonar.projectName=Github_Workflow_Integration_Demo
            -Dsonar.sources=.
            -Dsonar.verbose=true